name: CI

on:
  push:
    branches: [ main ]

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        service: [database, backend, frontend]

    steps:
      - name: Скачать код репозитория
        uses: actions/checkout@v4

      - name: Войти в реестр ghcr.io
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ${{ env.REGISTRY }} -u ${{ github.actor }} --password-stdin

      - name: Собрать и отправить образ
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          IMAGE=${{ env.REGISTRY }}/$OWNER/studentclass-${{ matrix.service }}:latest
          docker build -t $IMAGE ./${{ matrix.service }}
          docker push $IMAGE
