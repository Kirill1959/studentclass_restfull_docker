name: CI

on:
  push:
    branches: [main]

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ${{ env.REGISTRY }} -u ${{ github.actor }} --password-stdin

      - name: Build and push images
        run: |
          OWNER=${{ github.repository_owner }}
          OWNER=${OWNER,,}

          docker build -t ${{ env.REGISTRY }}/$OWNER/studentclass-db:latest ./database
          docker push ${{ env.REGISTRY }}/$OWNER/studentclass-db:latest

          docker build -t ${{ env.REGISTRY }}/$OWNER/studentclass-backend:latest ./backend
          docker push ${{ env.REGISTRY }}/$OWNER/studentclass-backend:latest

          docker build -t ${{ env.REGISTRY }}/$OWNER/studentclass-frontend:latest ./frontend
          docker push ${{ env.REGISTRY }}/$OWNER/studentclass-frontend:latest
